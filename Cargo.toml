[package]
name = "ogc-cql2"
authors = ["Raif S. Naffah <raif@mailbox.org>"]
version = "0.7.2"
edition = "2024"
description = "OGC CQL2 Text + JSON Encoding parser and interpreter in Rust"
repository = "https://github.com/raif-s-naffah/ogc-cql2"
license = "Apache-2.0"
keywords = ["OGC", "CQL2", "PEG", "JSON", "Interpreter"]
categories = ["data-structures", "encoding", "parser-implementations", "science::geo"]

[dependencies]
# core dependencies, common to all features...
async-trait = "0.1.92"
dotenvy = "0.15.7"
futures = "0.3.33"
geos = { version = "11.1.1", features = ["v3_12_0"] }
jiff = { version = "0.2.35", features = ["serde"] }
paste = "1.0.15"
peg = "0.8.6"
proj = { version = "0.31.0", default-features = false }
# used in 'typify' generated code, which in turn is used, after modification,
# to bootstrap the JSON-encoded parser
regress = { version = "0.11.1", features = ["prohibit-unsafe"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# needed to work-around the limitation of 'typify' unable to properly
# handle `enum` variants that consist of symbols; e.g. '+', '-', etc...
serde_with = { version = "3.21.0", features = ["macros"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
unicase = "2.9.0"
unicode-normalization = "0.1.25"

# features' optional dependencies...
csv = { version = "1.4.0", optional = true }
sqlx = { version = "0.9.0", features = [
    "runtime-tokio",
    "sqlite",
    "postgres",
    "derive",
    "time",
], optional = true }

[dev-dependencies]
approx = "0.5.1"
criterion = { version = "0.8.2", features = ["async_tokio", "html_reports"] }
rand = "0.10.1"
tracing-test = { version = "0.2.6", features = ["no-env-filter"] }
walkdir = "2.5.0"

[features]
default = []                         # user MUST select which data-source(s) to use...
csv_ds = ["dep:csv"]                 # CSV data-source
gpkg_ds = ["dep:sqlx"]               # GeoPackage data-source
pg_ds = ["dep:sqlx"]                 # PostGIS tables in PostgreSQL database
all = ["csv_ds", "gpkg_ds", "pg_ds"]

[[bench]]
name = "parse"
harness = false

[[bench]]
name = "eval"
harness = false

[[bench]]
name = "sql"
harness = false
